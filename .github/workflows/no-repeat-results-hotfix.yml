name: Deep canonical Greatest Hits catalogue

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/no-repeat-results-hotfix.yml
      - scripts/build_catalogue_v10.py
      - scripts/audit_catalogue_variants.py

permissions:
  contents: write

concurrency:
  group: canonical-song-year-catalogue
  cancel-in-progress: true

jobs:
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install builder dependencies
        run: pip install requests beautifulsoup4
      - name: Promote canonical single-mode builder
        run: cp scripts/build_catalogue_v10.py scripts/build_catalogue.py
      # Exact per-candidate recording verification is deliberate: batch OR searches dropped valid old songs.
      # This workflow change intentionally retriggers the build against the current canonical version rules.
      - name: Rebuild prebuilt Greatest Hits catalogue
        run: python scripts/build_catalogue.py
      - name: Validate JavaScript and no-repeat identity
        run: |
          node --check engine.js
          node --check engine-v7.js
          node --check app.js
          node scripts/test_engine_v7.mjs
      - name: Audit every song for alternate versions
        run: python scripts/audit_catalogue_variants.py
      - name: Validate catalogue contract
        run: |
          python - <<'PY'
          import ast,json,re
          from collections import Counter
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          import build_catalogue_v10 as b

          d=json.loads(Path('data/catalogue.json').read_text())
          assert d.get('version')==10,d.get('version')
          assert set(d.get('modes',{}))=={'greatest'},set(d.get('modes',{}))
          g=d['modes']['greatest']
          assert set(map(int,g))==set(range(1950,2023)),len(g)

          engine=Path('engine.js').read_text()
          m=re.search(r'const YEAR_MAP=(\[[^;]+\]);',engine)
          years=ast.literal_eval(re.sub(r'\bnull\b','None',m.group(1)))[1:]
          counts=Counter(int(y) for y in years if y)

          total=0
          for year in range(1950,2023):
              pool=g[str(year)]
              need=max(12,counts.get(year,0))
              assert len(pool)>=need,(year,len(pool),need)
              total+=len(pool)
              keys=set()
              for s in pool:
                  assert int(s['year'])==year,(year,s)
                  assert s['yearEvidence']=='MusicBrainz recording earliest first-release-date',(year,s)
                  assert not b.is_explicit_alternate_title(s['title']),(year,s)
                  assert s['canonicalKey']==b.underlying_key(s['title'],s['artist']),(year,s)
                  assert s['canonicalKey'] not in keys,(year,s['canonicalKey'])
                  keys.add(s['canonicalKey'])
                  assert int(s['chartYear'])>=year,(year,s)
                  assert int(s['chartYear'])<=year+2,(year,s)

          titles=lambda y:{b.norm(s['title']) for s in g[str(y)]}
          for title in ['blinding lights','levitating','save your tears']:
              assert title not in titles(2021),(title,2021)
          for title in ['heat waves','shivers','bad habits']:
              assert title not in titles(2022),(title,2022)

          assert b.underlying_key('Example - 2011 Remaster','Artist')==b.underlying_key('Example','Artist')
          assert b.underlying_key('Example (Radio Edit)','Artist feat. Guest')==b.underlying_key('Example','Artist')
          assert b.is_explicit_alternate_title('Example (Live)')
          assert not b.is_explicit_alternate_title('Live and Let Die')
          print('catalogue contract passed',{'years':len(g),'songs':total,'min':min(map(len,g.values())),'max':max(map(len,g.values()))})
          PY
      - name: Update deployed cache versions
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('engine.js')
          s=p.read_text()
          s=re.sub(r'\./data/catalogue\.json\?v=\d+(?:\.\d+)*','./data/catalogue.json?v=10',s)
          p.write_text(s)
          p=Path('index.html')
          h=p.read_text()
          for asset in ['app.css','engine.js','engine-v7.js','app.js']:
              h=re.sub(rf'{re.escape(asset)}\?v=[^"\']+',f'{asset}?v=7.4.0',h)
          p.write_text(h)
          PY
          grep -q "catalogue.json?v=10" engine.js
          grep -q "v=7.4.0" index.html
      - name: Validate normal app catalogue checks
        run: |
          python scripts/validate_catalogue.py
          python -m json.tool data/catalogue.schema.json >/dev/null
      - name: Commit canonical variant-free catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_catalogue.py scripts/build_catalogue_v10.py scripts/audit_catalogue_variants.py scripts/test_engine_v7.mjs data/catalogue.json data/catalogue.schema.json engine.js engine-v7.js index.html
          git commit -m "Build variant-free canonical Greatest Hits catalogue"
          git pull --rebase origin main
          git push
