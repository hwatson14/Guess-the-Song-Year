name: Canonical catalogue and playlists

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/no-repeat-results-hotfix.yml
      - scripts/build_catalogue_v8.py
      - scripts/build_catalogue_v10.py
      - scripts/build_modes.py

permissions:
  contents: write

concurrency:
  group: canonical-song-year-catalogue
  cancel-in-progress: true

jobs:
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install builder dependencies
        run: pip install requests beautifulsoup4
      - name: Promote canonical catalogue builder
        run: cp scripts/build_catalogue_v10.py scripts/build_catalogue.py
      - name: Rebuild canonical catalogue and themed playlists
        run: python scripts/build_catalogue.py
      - name: Validate catalogue and runtime
        run: |
          node --check engine.js
          node --check engine-v7.js
          node --check app.js
          node scripts/test_engine_v7.mjs
          python scripts/validate_catalogue.py
          python -m json.tool data/catalogue.schema.json >/dev/null
          python - <<'PY'
          import json,re,unicodedata
          from pathlib import Path
          d=json.loads(Path('data/catalogue.json').read_text())
          assert d.get('version')==10,d.get('version')
          expected={'greatest','sing_along','australian','unexpected','party','rock'}
          assert set(d['modes'])==expected,set(d['modes'])
          g=d['modes']['greatest']
          sizes={int(y):len(v) for y,v in g.items()}
          assert len(sizes)==73,len(sizes)
          assert min(sizes.values())>=8,min(sizes.values())
          assert sum(sizes.values())>=584,sum(sizes.values())
          assert d.get('poolStats',{}).get('chartLookaheadYears')==2,d.get('poolStats')
          def norm(v):
              return re.sub(r'[^a-z0-9]+',' ',unicodedata.normalize('NFKD',str(v)).encode('ascii','ignore').decode().lower()).strip()
          global_seen={}
          bad_variant=re.compile(r'\b(pt\.?\s*\d+|mixed|remix|karaoke|backing track)\b',re.I)
          for year,pool in g.items():
              local=set()
              for s in pool:
                  k=(norm(s['title']),norm(s['artist']))
                  assert k not in local,(year,k)
                  local.add(k)
                  assert int(s['year'])==int(year),(year,s)
                  assert s.get('yearEvidence')=='MusicBrainz release-group earliest first-release-date',(year,s)
                  assert not bad_variant.search(s['title']),s
                  assert int(s.get('chartYear',year))>=int(year),(year,s)
                  assert int(s.get('chartYear',year))<=int(year)+2,(year,s)
                  assert float(s.get('titleSimilarity',0))>=0.55,(year,s)
                  assert float(s.get('artistSimilarity',0))>=0.45,(year,s)
                  prior=global_seen.get(k)
                  assert prior in (None,year),(k,prior,year)
                  global_seen[k]=year
          for mode in expected-{'greatest'}:
              assert d['modeFallbacks'].get(mode)=='greatest',mode
              assert len(d['modes'][mode])>=15,(mode,len(d['modes'][mode]))
              for year,pool in d['modes'][mode].items():
                  assert all(int(s['year'])==int(year) for s in pool),(mode,year)
          titles=lambda y:{norm(s['title']) for s in g[str(y)]}
          for title in ['blinding lights','levitating','mood','save your tears']:
              assert title not in titles(2021),(title,2021)
          for title in ['heat waves','shivers','bad habits']:
              assert title not in titles(2022),(title,2022)
          print('greatest pool stats',{'min':min(sizes.values()),'max':max(sizes.values()),'total':sum(sizes.values())})
          print('playlist stats',d['playlistStats'])
          PY
          grep -q "catalogue.json?v=10" engine.js
          grep -q "v=8.0.0" index.html
      - name: Commit canonical catalogue and playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_catalogue.py scripts/build_catalogue_v8.py scripts/build_catalogue_v10.py scripts/build_modes.py scripts/validate_catalogue.py scripts/test_engine_v7.mjs data/catalogue.json data/catalogue.schema.json engine.js engine-v7.js app.js index.html README.md
          git commit -m "Build canonical catalogue and themed playlists"
          git pull --rebase origin main
          git push
