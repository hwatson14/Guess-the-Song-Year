name: Apply mode expansion canonical data

on:
  push:
    branches: [fix/remaining-issues-audit]
    paths:
      - .github/workflows/apply-mode-expansion-data.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/remaining-issues-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add reviewed canonical songs and rebuild runtime catalogue
        run: |
          node scripts/add_mode_expansion_songs.mjs
          node scripts/song_database.mjs build
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/song-database.json data/catalogue.json data/mode-expansion.json
          git diff --cached --quiet && exit 0
          git commit -m "Add canonical songs for Preview modes"
          git push origin HEAD:fix/remaining-issues-audit
