name: One-time app hotfix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch current Spotify API and hidden-answer UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace("E.headline.textContent='Choosing a '+year+' song…';", "E.headline.textContent='Choosing a song…';")
          s = s.replace("Math.floor(Math.random()*5)*20", "Math.floor(Math.random()*5)*10")
          s = s.replace("&type=track&limit=20&offset=", "&type=track&limit=10&offset=")
          p.write_text(s)
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix hidden year and Spotify 2026 search limit"
          git push
