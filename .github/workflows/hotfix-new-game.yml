name: Fix New Game tap target

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-new-game.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          css=Path('app.css')
          s=css.read_text()
          if '.hero:before{pointer-events:none;' not in s:
              s=s.replace('.hero:before{content:', '.hero:before{pointer-events:none;content:', 1)
          if '.hero-actions{position:relative;z-index:2;' not in s:
              s=s.replace('.hero-actions{display:flex;', '.hero-actions{position:relative;z-index:2;display:flex;', 1)
          css.write_text(s)

          js=Path('app.js')
          s=js.read_text()
          old="function newGame(){stopScanner();E.destroyYouTube();match=null;current=null;pendingSlot=null;placementResult=null;saveMatch();screen='setup';render()}"
          new="function newGame(){stopScanner();E.destroyYouTube();playing=false;playNeedsTap=false;musicModal=false;match=null;current=null;pendingSlot=null;placementResult=null;localStorage.removeItem(MATCH_KEY);screen='setup';render();requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'instant'}))}"
          if old not in s:
              raise SystemExit('newGame insertion point not found')
          s=s.replace(old,new,1)
          js.write_text(s)
          PY
          node --check app.js
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.css app.js
          git rm .github/workflows/hotfix-new-game.yml
          git commit -m "Fix New Game button interaction"
          git pull --rebase origin main
          git push
