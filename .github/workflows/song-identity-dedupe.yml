name: Apply song identity dedupe

on:
  push:
    branches:
      - fix/song-identity-dedup-spotify

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Diagnose global provider collisions
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const db=JSON.parse(fs.readFileSync('data/song-database.json','utf8'));
          for(const provider of ['spotify','youtube']){
            const owners=new Map(),collisions=[];
            for(const song of Object.values(db.songs))for(const link of song.providers?.[provider]?.links||[]){
              const prior=owners.get(link.id);
              if(prior&&prior.id!==song.id)collisions.push({provider,linkId:link.id,a:prior,b:{id:song.id,title:song.title,artist:song.artist,canonicalKey:song.canonicalKey}});
              else owners.set(link.id,{id:song.id,title:song.title,artist:song.artist,canonicalKey:song.canonicalKey});
            }
            console.log(JSON.stringify({provider,collisions},null,2));
          }
          JS
      - name: Add verified Roxette provider correction to migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/migrations/2026-09-06-song-identity-dedupe.mjs')
          text=p.read_text()
          anchor="const BAD_PROVIDER_LINKS=[\n"
          addition="  {songId:'song_c5aef0dc987135ed9bac',provider:'spotify',id:'6kvoHl80mfCVTv7XnZkjQn',reason:'This Spotify track is the 1990 Pretty Woman recording, not the distinct 1987 Christmas recording.'},\n"
          if addition not in text:
              text=text.replace(anchor,anchor+addition)
          p.write_text(text)
          PY
      - name: Apply dedupe migration
        run: node scripts/migrations/2026-09-06-song-identity-dedupe.mjs --write
      - name: Rebuild generated catalogue and coverage report
        run: |
          node scripts/song_database.mjs build
          node scripts/song_database_report.mjs --write
      - name: Validate full application and catalogue
        run: node scripts/check.mjs
      - name: Check generated diff
        run: git diff --check
      - name: Commit migrated source and generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/song-identity-dedupe.yml
          rm scripts/migrations/2026-09-06-song-identity-dedupe.mjs
          git add -A
          git commit -m "Deduplicate master song identities and repair Spotify mappings"
          git push origin HEAD:fix/song-identity-dedup-spotify
