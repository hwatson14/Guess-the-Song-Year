name: Patch v10 version context

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-v10-version-context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pip install requests beautifulsoup4
      - name: Make version detection annotation-aware
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_catalogue_v10.py')
          s=p.read_text()
          old="""def is_explicit_alternate_title(title):\n    return bool(VERSION_MARKER.search(clean(title)))\n"""
          new="""STRONG_TRAILING_VERSION = re.compile(\n    r'\\b(?:remix|re[- ]?mix|remaster(?:ed)?(?:\\s*\\d{4})?|radio edit|radio version|'\n    r'single edit|single version|album version|extended version|club mix|dance mix|'\n    r'original mix|acoustic version|live version|instrumental version|sped up|slowed|'\n    r're[- ]?record(?:ed)?|clean version)\\s*$', re.I,\n)\n\n\ndef is_explicit_alternate_title(title):\n    \"\"\"Detect metadata version annotations without rejecting genuine song titles.\n\n    For example, \"Live and Let Die\" is a real title, while \"Song (Live)\" and\n    \"Song - Live\" are alternate versions.\n    \"\"\"\n    s = clean(title)\n    if not s:\n        return False\n    for inside in re.findall(r'\\(([^)]*)\\)|\\[([^]]*)\\]', s):\n        text = inside[0] or inside[1]\n        if VERSION_MARKER.search(text):\n            return True\n    suffix = re.search(r'\\s[-–—:]\\s(.+)$', s)\n    if suffix and VERSION_MARKER.search(suffix.group(1)):\n        return True\n    return bool(STRONG_TRAILING_VERSION.search(s))\n"""
          if old not in s:
              raise SystemExit('alternate-title function patch point not found')
          s=s.replace(old,new,1)
          old2="""    s = re.sub(r'\\s+(?:feat\\.?|ft\\.?|featuring|with)\\s+.+$', '', s, flags=re.I)\n    return clean(s)\n"""
          new2="""    s = re.sub(r'\\s+(?:feat\\.?|ft\\.?|featuring|with)\\s+.+$', '', s, flags=re.I)\n    s = STRONG_TRAILING_VERSION.sub(' ', s) if 'STRONG_TRAILING_VERSION' in globals() else s\n    return clean(s)\n"""
          if old2 not in s:
              raise SystemExit('base_title patch point not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          python -m py_compile scripts/build_catalogue_v10.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import build_catalogue_v10 as b
          assert b.is_explicit_alternate_title('Song (Live)')
          assert b.is_explicit_alternate_title('Song - 2011 Remaster')
          assert b.is_explicit_alternate_title('Song (Radio Edit)')
          assert not b.is_explicit_alternate_title('Live and Let Die')
          assert not b.is_explicit_alternate_title('I Want to Live')
          assert b.underlying_key('Song (Radio Edit)','Artist feat. Guest')==b.underlying_key('Song','Artist')
          PY
      - name: Commit context-aware version detection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_catalogue_v10.py
          git commit -m "Make catalogue version detection annotation-aware"
          git pull --rebase origin main
          git push