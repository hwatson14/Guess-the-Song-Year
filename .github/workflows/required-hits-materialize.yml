name: Materialize required Greatest Hits
on:
  push:
    branches:
      - fix/required-greatest-hits-killers-eiffel65-20261102

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed release-year additions to canonical source and generated catalogue
        run: node scripts/migrations/2026-11-02-required-greatest-hits.mjs
      - name: Check canonical build and regression
        run: |
          node scripts/song_database.mjs check
          node scripts/test_song_database.mjs
      - name: Commit materialized data to this feature branch
        run: |
          git add data/song-database.json data/catalogue.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: materialize two sourced required Greatest Hits tracks"
            git push
          fi
