name: Materialize Greatest Hits v20
on:
  push:
    branches:
      - feat/greatest-hits-v20-curated-classics-20261104

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Apply audited Greatest Hits v20 promotions
        run: node scripts/migrations/apply-greatest-hits-v20.mjs
      - name: Validate canonical source, compiled catalogue and full app
        run: |
          node scripts/song_database.mjs check
          node scripts/check.mjs
      - name: Commit source and compiled data to feature branch
        run: |
          git add data/song-database.json data/catalogue.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: materialize 58 reviewed Greatest Hits v20 memberships"
            git push
          fi
