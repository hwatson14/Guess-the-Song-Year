name: Physical scan countdown flow hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/physical-flow-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch
        run: python scripts/patch_physical_flow.py
      - name: Validate patch
        run: |
          node --check app.js
          grep -q "if(cfg.playMode==='physical'){saveMatch();beginMusicCountdown();return}" app.js
          grep -q "function guessNow" app.js
          grep -q "guess-now')b.onclick=guessNow" app.js
          grep -q "screen==='youtube'&&cfg.playMode==='virtual'" app.js
          grep -q "v=7.2.4" index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Auto-start countdown after scan and reveal from Guess now"
          git pull --rebase origin main
          git push
