name: Test playlist source integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-playlist-sources.yml
      - scripts/augment_playlists_v10.py
      - scripts/finalize_playlist_runtime_v11.py
      - scripts/build_modes.py

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Exercise augmentation and app patch without external metadata calls
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import augment_playlists_v10 as a

          p=Path('data/catalogue.json')
          d=json.loads(p.read_text())
          d['version']=10
          d['modes']={'greatest':d['modes']['greatest']}
          p.write_text(json.dumps(d,separators=(',',':')))

          a.canonical.bimmuda_lookup=lambda: ({},{})
          def evidence(row):
              return {
                  'year': 2000,
                  'musicbrainzId': 'fixture-recording',
                  'musicbrainzMatchedTitle': row['title'],
                  'musicbrainzMatchedArtist': row['artist'],
                  'mbScore': 100.0,
                  'titleSimilarity': 1.0,
                  'artistSimilarity': 1.0,
              }
          a.canonical.confirm_release_year=evidence
          a.canonical.canonical_display=lambda row,e:(row['title'],row['artist'])
          a.main()
          PY
          python scripts/finalize_playlist_runtime_v11.py
      - name: Validate generated JavaScript contract
        run: |
          node --check engine.js
          node --check engine-v7.js
          node --check app.js
          node scripts/test_engine_v7.mjs
          grep -q 'data-mode=' app.js
          grep -q 'function modeId()' app.js
          ! grep -q "const MODE='greatest'" app.js
          grep -q 'Sing Along' engine-v7.js
          grep -q 'Australian' engine-v7.js
          grep -q 'Unexpected Years' engine-v7.js
          grep -q 'Party Anthems' engine-v7.js
          grep -q 'Rock Classics' engine-v7.js
