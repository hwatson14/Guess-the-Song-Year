name: Apply requested Icona Pop song (one-time)

on:
  push:
    branches: [codex/icona-pop-bangers-20261119]
    paths: [.github/workflows/add-icona-pop-once.yml]

permissions:
  contents: write

jobs:
  apply-song:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/icona-pop-bangers-20261119
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Apply source migration and compile production catalogue
        run: |
          node scripts/migrations/add-icona-pop-20261119.mjs
          node scripts/song_database.mjs build
      - name: Run full application checks before committing
        run: node scripts/check.mjs
      - name: Commit tested changes and remove one-time automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-icona-pop-once.yml scripts/migrations/add-icona-pop-20261119.mjs
          git add -A
          git diff --cached --check
          git commit -m "feat: add Icona Pop I Love It (2012) to Bangers"
          git push origin HEAD:codex/icona-pop-bangers-20261119
