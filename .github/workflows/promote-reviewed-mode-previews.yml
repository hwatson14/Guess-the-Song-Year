name: Promote reviewed mode previews

on:
  push:
    branches: [feat/reviewed-mode-previews]
    paths:
      - .github/workflows/promote-reviewed-mode-previews.yml
      - scripts/promote_reviewed_mode_expansion.mjs
      - scripts/test_reviewed_mode_previews.mjs
      - scripts/test_song_database.mjs
      - scripts/check.mjs
      - verification/mode-expansion/reviewed-mode-relationships.json

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Promote reviewed relationships
        run: node scripts/promote_reviewed_mode_expansion.mjs
      - name: Rebuild deterministic runtime catalogue
        run: node scripts/song_database.mjs build
      - name: Validate promoted source and runtime
        run: node scripts/check.mjs
      - name: Commit generated canonical source and runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/song-database.json data/catalogue.json data/modes.json verification/mode-expansion/promotion-report.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Promote reviewed Movie TV and Remix previews"
          git push

# Rerun marker after canonical matcher correction.
