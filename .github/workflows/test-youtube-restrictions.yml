name: Test YouTube restrictions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify allowed and blocked referrers
        shell: bash
        run: |
          KEY=$(python - <<'PY'
          import re
          s=open('index.html').read()
          m=re.search(r"const BUILTIN_YT_KEY='([^']+)'", s)
          assert m
          print(m.group(1))
          PY
          )
          URL="https://www.googleapis.com/youtube/v3/videos?part=id&id=dQw4w9WgXcQ&key=${KEY}"
          GOOD=$(curl -sS -o /tmp/good.json -w '%{http_code}' -H 'Referer: https://hwatson14.github.io/Guess-the-Song-Year/' "$URL")
          BAD=$(curl -sS -o /tmp/bad.json -w '%{http_code}' -H 'Referer: https://example.com/' "$URL")
          echo "Allowed referrer HTTP ${GOOD}"
          echo "Unapproved referrer HTTP ${BAD}"
          test "$GOOD" = "200"
          test "$BAD" != "200"
          echo "PASS: allowed site works and an unrelated site is blocked."
