name: Consolidate v6 app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rebuild consolidated application
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          files = {}
          files['index.html'] = ''
          files['app.css'] = ''
          files['engine.js'] = '[... ELLIPSIZATION ...]'
          files['.github/workflows/build-catalogue.yml'] = ''
          files['.github/workflows/validate.yml'] = ''
          files['.github/workflows/pages.yml'] = ''
          for path, payload in files.items():
              p=Path(path); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(gzip.decompress(base64.b64decode(payload)))
          for old in ['ux-hitster.css','ux-hitster.js','ux-v4.css','ux-v4.js','.github/workflows/embed-spotify-client.yml','.github/workflows/validate-premium-ui.yml']:
              p=Path(old)
              if p.exists(): p.unlink()
          PY
      - name: Validate rebuilt app
        run: |
          node --check engine.js
          node --check app.js
          python -m py_compile scripts/build_catalogue.py
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          assert 'ux-hitster' not in h and 'ux-v4' not in h
          assert h.count('<script') == 2
          assert Path('app.css').stat().st_size > 10000
          print('clean shell validated')
          PY
      - name: Commit consolidated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Consolidate app and harden playback"
          git push
