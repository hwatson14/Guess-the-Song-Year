name: Validate v11 playlists

on:
  push:
    branches: [feature/verified-playlists-v11]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-v11-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Validate materialized themes against current canonical rules
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import build_catalogue_v10 as c
          p=Path('data/themed_playlists_v11.json')
          if not p.exists():
              print('No materialized themed data yet; source/runtime checks still apply.')
              raise SystemExit(0)
          d=json.loads(p.read_text())
          expected={'sing_along','australian','unexpected','party','rock'}
          assert set(d['modes'])==expected,set(d['modes'])
          for mode,pools in d['modes'].items():
              assert len(pools)>=15,(mode,len(pools))
              assert sum(map(len,pools.values()))>=20,(mode,sum(map(len,pools.values())))
              song_keys=set()
              for year,pool in pools.items():
                  title_keys=set()
                  for s in pool:
                      assert int(s['year'])==int(year),(mode,year,s)
                      assert s['yearEvidence']=='MusicBrainz recording earliest first-release-date',(mode,year,s)
                      assert not c.is_explicit_alternate_title(s['title']),(mode,year,s)
                      key=c.underlying_key(s['title'],s['artist'])
                      assert s['canonicalKey']==key,(mode,year,s)
                      assert key not in song_keys,(mode,key)
                      song_keys.add(key)
                      title=c.base_title(s['title'])
                      assert title not in title_keys,(mode,year,'same-title duplicate',title)
                      title_keys.add(title)
          print('Materialized themed data passes current canonical rules.')
          PY
      - name: Exercise v11 builder deterministically
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import build_playlists_v11 as b
          p=Path('data/catalogue.json')
          d=json.loads(p.read_text())
          d['version']=10
          d['modes']={'greatest':d['modes']['greatest']}
          p.write_text(json.dumps(d,separators=(',',':')))
          b.canonical.bimmuda_lookup=lambda: ({},{})
          b.canonical.confirm_release_year=lambda row:{'year':2000,'musicbrainzId':'fixture','musicbrainzMatchedTitle':row['title'],'musicbrainzMatchedArtist':row['artist'],'mbScore':100.0,'titleSimilarity':1.0,'artistSimilarity':1.0}
          b.canonical.canonical_display=lambda row,e:(row['title'],row['artist'])
          b.main()
          PY
      - name: Validate generated runtime
        run: |
          node --check engine.js
          node --check engine-v7.js
          node --check app.js
          node scripts/test_engine_v7.mjs
          grep -q 'data-mode=' app.js
          grep -q 'function modeId()' app.js
          ! grep -q "const MODE='greatest'" app.js
          grep -q 'Sing Along' engine-v7.js
          grep -q 'Australian' engine-v7.js
          grep -q 'Unexpected Years' engine-v7.js
          grep -q 'Party Anthems' engine-v7.js
          grep -q 'Rock Classics' engine-v7.js
