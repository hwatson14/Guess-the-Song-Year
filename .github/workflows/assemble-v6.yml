name: Assemble v6 source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check staging files
        id: staging
        run: |
          if [ -f .build/engine.js.gz ] && [ -f .build/app.js.gz ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble source
        if: steps.staging.outputs.ready == 'true'
        run: |
          gzip -dc .build/engine.js.gz > engine.js
          gzip -dc .build/app.js.gz > app.js
          node --check engine.js
          node --check app.js
          python -m py_compile scripts/build_catalogue.py
      - name: Commit source and remove staging files
        if: steps.staging.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine.js app.js scripts/build_catalogue.py
          git rm -r .build
          git rm .github/workflows/assemble-v6.yml
          git commit -m "Complete consolidated v6 source"
          git push
