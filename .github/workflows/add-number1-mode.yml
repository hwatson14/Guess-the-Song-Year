name: Add Number 1 mode

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Patch app
        run: python tools/patch_number1.py
      - name: Verify JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          js = '\n'.join(re.findall(r'<script>(.*?)</script>', s, re.S))
          Path('/tmp/app.js').write_text(js)
          assert "number1:{name:'#1 of the Year'" in s
          assert 'async function numberOneCandidate(year)' in s
          PY
          node --check /tmp/app.js
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Billboard year-end number 1 mode"
          git push
