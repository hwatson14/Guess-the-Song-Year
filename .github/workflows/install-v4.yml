name: Install v4 game architecture

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Assemble v4 assets
        shell: bash
        run: |
          cat .build/v4/js/part* | base64 -d > ux-v4.js
          cat .build/v4/css/part* | base64 -d > ux-v4.css
          node --check ux-v4.js
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="./ux-v4.css?v=4">'
          js='<script src="./ux-v4.js?v=4"></script>'
          if css not in s:
              s=s.replace('</head>', css+'\n</head>', 1)
          if js not in s:
              s=s.replace('</body>', js+'\n</body>', 1)
          p.write_text(s)
          PY
          grep -q 'ux-v4.css?v=4' index.html
          grep -q 'ux-v4.js?v=4' index.html
          grep -q 'Game Setup' ux-v4.js
          grep -q 'Virtual' ux-v4.js
          grep -q 'Choose every song' ux-v4.js
          grep -q 'Victory target' ux-v4.js
          rm -rf .build/v4
          rm -f .github/workflows/install-v4.yml
      - name: Commit v4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement real-card and virtual game architecture"
          git push
