name: Hotfix round and YouTube gameplay

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-round-youtube.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply gameplay hotfix
        run: |
          echo '' | base64 -d > /tmp/gsy_patch.py
          python /tmp/gsy_patch.py
          node --check app.js
          python scripts/validate_catalogue.py
          grep -q "v=7.2" index.html
          grep -q "youtube-obscured" app.js
          grep -q "countdownScreen" app.js
          grep -q "scanBusy" app.js
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css index.html .github/workflows/validate.yml
          git rm .github/workflows/hotfix-round-youtube.yml
          git commit -m "Fix round reset, scanner lifecycle and YouTube concealment"
          git pull --rebase origin main
          git push
