name: Hotfix round and YouTube gameplay

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-round-youtube.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove stale playback handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          start="\n  async function playCurrent(){\n    if(!current||playing)return;\n    match.phase='playing';match.current=current;saveMatch();screen='playing';render();"
          i=s.find(start)
          if i < 0:
              raise SystemExit('stale playCurrent handler not found')
          j=s.find("\n  async function replaceCurrentSong(){", i)
          if j < 0:
              raise SystemExit('replaceCurrentSong boundary not found')
          s=s[:i]+s[j:]
          p.write_text(s)
          PY
          node --check app.js
          test "$(grep -c 'async function playCurrent' app.js)" -eq 1
          grep -q "beginYouTubeCountdown" app.js
      - name: Commit gameplay file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Remove stale playback handler"
          git pull --rebase origin main
          git push
