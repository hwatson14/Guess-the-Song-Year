name: Hotfix round and YouTube gameplay

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-round-youtube.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply gameplay hotfix
        run: |
          python scripts/hotfix_round_youtube.py
          node --check app.js
          python scripts/validate_catalogue.py
          grep -q "v=7.2" index.html
          grep -q "countdownScreen" app.js
          grep -q "youtubeListeningScreen" app.js
          grep -q "guessScreen" app.js
          grep -q "scanBusy" app.js
      - name: Commit gameplay files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css index.html
          git commit -m "Fix scanner lifecycle and YouTube face-down flow"
          git pull --rebase origin main
          git push
