name: Install v4 physical and virtual game flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build v4 UI files
        shell: bash
        run: |
          set -euo pipefail
          test -f .tmp/v4_js_1
          test -f .tmp/v4_js_tail
          test -f .tmp/v4_css
          cat .tmp/v4_js_1 .tmp/v4_js_tail | base64 -d | gzip -d > ux-hitster.js
          cat .tmp/v4_css | base64 -d | gzip -d > ux-hitster.css
      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check ux-hitster.js
          grep -q "playMode:'physical'" ux-hitster.js
          grep -q "data-play=\"virtual\"" ux-hitster.js
          grep -q "data-policy=\"each\"" ux-hitster.js
          grep -q "data-victory=\"unlimited\"" ux-hitster.js
          grep -q "uxVirtualPlace" ux-hitster.js
          grep -q "uxTeamsCount" ux-hitster.js
          grep -q "No example years are shown here" ux-hitster.js
          grep -q ".ux-timeline-slot" ux-hitster.css
          grep -q ".ux-choice-grid" ux-hitster.css
          grep -q './ux-hitster.js' index.html
          grep -q './ux-hitster.css' index.html
          echo 'v4 game flow validated'
      - name: Commit v4 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tmp/v4_js_1 .tmp/v4_js_tail .tmp/v4_css
          rm -f .github/workflows/install-v4-game-flow.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement physical and virtual team game flow"
          git push
