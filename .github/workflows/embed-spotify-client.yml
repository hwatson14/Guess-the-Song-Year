name: Embed Spotify client

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure persistent Spotify PKCE client
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          cid='c088fe548e9b4f6c886bce6b0db64e16'

          yt="const BUILTIN_YT_KEY='AIzaSyDJvhC5aEQES30hAcwNhc3-eeAR_WWE0K8';"
          sp=f"const BUILTIN_SPOTIFY_CLIENT_ID='{cid}';"
          if sp not in s:
              assert yt in s
              s=s.replace(yt, yt+'\n'+sp, 1)

          old="let ytKey=localStorage.getItem(K.yt)||BUILTIN_YT_KEY, client=localStorage.getItem(K.client)||'', device=localStorage.getItem(K.device)||'';"
          new="let ytKey=localStorage.getItem(K.yt)||BUILTIN_YT_KEY, client=localStorage.getItem(K.client)||BUILTIN_SPOTIFY_CLIENT_ID, device=localStorage.getItem(K.device)||'';"
          if old in s:
              s=s.replace(old,new,1)

          old="function saveClient(){client=E.clientId.value.trim();localStorage.setItem(K.client,client)}"
          new="function saveClient(){let v=E.clientId.value.trim();client=v||BUILTIN_SPOTIFY_CLIENT_ID;if(v)localStorage.setItem(K.client,v);else localStorage.removeItem(K.client);E.clientId.value=client}"
          if old in s:
              s=s.replace(old,new,1)

          old="<label for=\"clientId\">Spotify Client ID</label><input id=\"clientId\" autocomplete=\"off\" placeholder=\"Spotify app Client ID\">"
          new="<label for=\"clientId\">Spotify Client ID <span class=\"small\">(preconfigured; optional override)</span></label><input id=\"clientId\" autocomplete=\"off\" placeholder=\"Preconfigured Spotify app\">"
          if old in s:
              s=s.replace(old,new,1)

          old="async function accessToken(){if(!token?.access_token)throw new Error('Spotify is not connected.');if(Date.now()<(token.expires_at||0)-60000)return token.access_token;if(!token.refresh_token)throw new Error('Spotify session expired. Reconnect.');let b=new URLSearchParams({grant_type:'refresh_token',refresh_token:token.refresh_token,client_id:client});let r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b});if(!r.ok)throw new Error('Spotify refresh failed. Reconnect.');let t=await r.json();setToken({...t,refresh_token:t.refresh_token||token.refresh_token});return token.access_token}"
          new="async function accessToken(){if(!token?.access_token)throw new Error('Spotify is not connected.');if(Date.now()<(token.expires_at||0)-60000)return token.access_token;if(!token.refresh_token)throw new Error('Spotify session expired. Reconnect.');let b=new URLSearchParams({grant_type:'refresh_token',refresh_token:token.refresh_token,client_id:client});let r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b});let t=await r.json().catch(()=>({}));if(!r.ok){if(t.error==='invalid_grant'){token=null;localStorage.removeItem(K.token);render();throw new Error('Spotify authorization has expired. Connect Spotify once to renew it.')}throw new Error('Spotify refresh failed. Reconnect.')}setToken({...t,refresh_token:t.refresh_token||token.refresh_token});return token.access_token}"
          if old in s:
              s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Validate configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert "const BUILTIN_SPOTIFY_CLIENT_ID='c088fe548e9b4f6c886bce6b0db64e16';" in s
          assert "client=localStorage.getItem(K.client)||BUILTIN_SPOTIFY_CLIENT_ID" in s
          assert "invalid_grant" in s
          scripts=[]
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', s, re.S|re.I):
              if 'src=' not in attrs.lower() and body.strip():
                  scripts.append(body)
          assert scripts, 'No inline JavaScript found'
          Path('/tmp/app.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/app.js
          node --check ux-hitster.js
      - name: Commit configuration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Configure Spotify client for persistent PKCE sessions"
          git push
