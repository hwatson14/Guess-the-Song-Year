name: Spotify no-countdown hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/spotify-no-countdown-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply Spotify playback patch
        run: |
          python scripts/patch_spotify_no_countdown.py
          node --check app.js
          grep -q "if(current.provider==='spotify'){await startSpotifyListening();return}" app.js
          grep -q "v=7.2.5" index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Start Spotify immediately without countdown"
          git pull --rebase origin main
          git push
