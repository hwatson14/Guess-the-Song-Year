name: Materialize verified themed playlists

on:
  push:
    branches: [feature/verified-playlists-v11]
    paths:
      - .github/workflows/materialize-themed-playlists.yml
      - scripts/build_playlists_v11.py
      - scripts/build_modes.py
      - scripts/build_catalogue_v10.py

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: materialize-v11-themes
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/verified-playlists-v11
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Verify every curated themed song independently
        run: |
          python - <<'PY'
          import json,time,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import build_playlists_v11 as b
          modes,rejected=b.build_themed_modes({})
          out={'version':11,'generatedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'yearSemantics':'MusicBrainz recording earliest first-release-date','modes':modes,'modeMeta':{m:b.MODE_META[m] for m in b.ACTIVE if m!='greatest'},'fallback':'greatest-same-year','stats':{m:{'years':len(v),'songs':sum(len(p) for p in v.values()),'rejectedSeeds':len(rejected[m])} for m,v in modes.items()},'rejectedSeeds':rejected}
          Path('data/themed_playlists_v11.json').write_text(json.dumps(out,ensure_ascii=False,separators=(',',':')))
          print('Verified themed playlist stats',out['stats'])
          PY
      - name: Validate themed data
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import build_catalogue_v10 as c
          d=json.loads(Path('data/themed_playlists_v11.json').read_text())
          expected={'sing_along','australian','unexpected','party','rock'}
          assert set(d['modes'])==expected,set(d['modes'])
          for mode,pools in d['modes'].items():
              assert len(pools)>=15,(mode,len(pools))
              assert sum(map(len,pools.values()))>=20,(mode,sum(map(len,pools.values())))
              seen=set()
              for year,pool in pools.items():
                  for s in pool:
                      assert int(s['year'])==int(year),(mode,year,s)
                      assert s['yearEvidence']=='MusicBrainz recording earliest first-release-date',(mode,year,s)
                      assert not c.is_explicit_alternate_title(s['title']),(mode,year,s)
                      key=c.underlying_key(s['title'],s['artist'])
                      assert s['canonicalKey']==key,(mode,year,s)
                      assert (int(year),key) not in seen,(mode,year,key)
                      seen.add((int(year),key))
          print('Themed data validation passed')
          PY
          python -m json.tool data/themed_playlists_v11.json >/dev/null
      - name: Commit verified themed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/themed_playlists_v11.json
          if git diff --cached --quiet; then echo 'No themed data changes.'; exit 0; fi
          git commit -m "Materialize verified themed playlists"
          git pull --rebase origin feature/verified-playlists-v11
          git push origin feature/verified-playlists-v11
