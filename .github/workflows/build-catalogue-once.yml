name: Build final static catalogue

on:
  push:
    branches: [main]
    paths:
      - scripts/build_catalogue.py
      - .github/workflows/build-catalogue-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-catalogue
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Validate builder
        run: python -m py_compile scripts/build_catalogue.py
      - name: Build catalogue
        run: python scripts/build_catalogue.py
      - name: Validate catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/catalogue.json').read_text())
          assert d['version']==6
          for m in ['greatest','number1_us','number1_au']:
            missing=[y for y in range(1950,2023) if not d['modes'][m].get(str(y))]
            assert not missing,(m,missing)
          assert d['coverage']['australian'] >= 35, d['coverage']
          fallbacks=sum(1 for p in d['modes']['greatest'].values() for x in p if x.get('source')=='chart-year-fallback')
          print('coverage',d['coverage'])
          print('Greatest chart-year fallbacks',fallbacks)
          PY
      - name: Commit final catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_catalogue.py data/catalogue.json
          git rm .github/workflows/build-catalogue-once.yml
          git commit -m "Finish static song catalogue"
          git pull --rebase origin main
          git push
