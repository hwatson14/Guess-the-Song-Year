name: Build final static catalogue

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-catalogue-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Repair builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_catalogue.py')
          s=p.read_text()
          s=s.replace("List_of_top_25_singles_for_{yeary_in_Australia", "List_of_top_25_singles_for_{year}_in_Australia")
          s=s.replace("urls=[WIKI.format(year=year),f'https://en.wikipedia.org/wiki/List_of_top_100_singles_for_{year}_in_Australia']", "urls=[WIKI.format(year=year),f'https://en.wikipedia.org/wiki/List_of_Top_25_singles_for_{year}_in_Australia',f'https://en.wikipedia.org/wiki/List_of_top_100_singles_for_{year}_in_Australia',f'https://en.wikipedia.org/wiki/List_of_Top_100_singles_for_{year}_in_Australia']")
          old="        if not pool:raise RuntimeError(f'No exact-year Greatest Hits candidate for {y}')"
          new="""        if not pool:\n            candidates=sorted([r for r in bim if r['chartYear']==y],key=lambda r:r['rank'])\n            for r in candidates:\n                info=mb_release_year(r['title'],r['artist'])\n                if info and info[0]==y:\n                    pool.append(attach_ids({'title':info[1],'artist':info[2],'year':y,'chartRank':r['rank'],'source':'billboard-release-fallback','sourceLabel':'Billboard year-end · release year verified'},lookup));break\n            if not pool and candidates:\n                r=candidates[0];pool.append(attach_ids({'title':r['title'],'artist':r['artist'],'year':y,'chartYear':y,'chartRank':r['rank'],'source':'billboard-chart-year-fallback','sourceLabel':'Billboard year-end chart year fallback'},lookup))\n        if not pool:raise RuntimeError(f'No Greatest Hits candidate for {y}')"""
          if old not in s:
              raise SystemExit('Greatest Hits fallback insertion point not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python -m py_compile scripts/build_catalogue.py
      - name: Build catalogue
        run: |
          python - <<'PY'
          import scripts.build_catalogue as b
          early={
            1950:{'rank':1,'title':'Quicksilver','artist':'Bing Crosby & The Andrews Sisters'},
            1951:{'rank':1,'title':'Too Young','artist':'Nat King Cole'},
            1952:{'rank':1,'title':"Auf Wiederseh'n Sweetheart",'artist':'Vera Lynn'},
            1953:{'rank':1,'title':'Pretend','artist':'Nat King Cole'},
            1954:{'rank':1,'title':'The Happy Wanderer','artist':'Frank Weir'},
          }
          original=b.annual_chart
          b.annual_chart=lambda year:[early[year]] if year in early else original(year)
          b.main()
          PY
      - name: Validate catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/catalogue.json').read_text())
          assert d['version']==6
          for m in ['greatest','number1_us','number1_au']:
            missing=[y for y in range(1950,2023) if not d['modes'][m].get(str(y))]
            assert not missing,(m,missing)
          assert len(d['modes']['australian'])>=55
          print('coverage',d['coverage'])
          print('greatest chart-year fallbacks',sum(1 for p in d['modes']['greatest'].values() for x in p if x.get('source')=='billboard-chart-year-fallback'))
          PY
      - name: Commit final catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_catalogue.py data/catalogue.json
          git rm .github/workflows/build-catalogue-once.yml
          git commit -m "Finish static song catalogue"
          git pull --rebase origin main
          git push
