name: Apply remaining issue patches

on:
  push:
    branches: [fix/remaining-issues-audit]
    paths:
      - .github/workflows/apply-remaining-issue-patches.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/remaining-issues-audit
      - name: Apply deterministic patches
        run: python scripts/apply_remaining_issue_patches.py
      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply remaining issue fixes"
          git push origin HEAD:fix/remaining-issues-audit
