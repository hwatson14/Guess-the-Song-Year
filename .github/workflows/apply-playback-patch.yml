name: Apply playback recovery patch

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_playback_v6.py
      - .github/workflows/apply-playback-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch
        run: |
          python scripts/patch_playback_v6.py
          node --check app.js
          grep -q "replaceCurrentSong" app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git rm scripts/patch_playback_v6.py .github/workflows/apply-playback-patch.yml
          git commit -m "Harden song playback recovery"
          git pull --rebase origin main
          git push
