name: Build static catalogue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_catalogue.py
      - .github/workflows/build-catalogue.yml

permissions:
  contents: write

concurrency:
  group: build-catalogue
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install catalogue dependencies
        run: pip install requests beautifulsoup4
      - name: Repair and optimise builder source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_catalogue.py')
          s=p.read_text()
          s=s.replace("List_of_top_25_singles_for_{yeary_in_Australia", "List_of_top_25_singles_for_{year}_in_Australia")
          old="urls=[WIKI.format(year=year),f'https://en.wikipedia.org/wiki/List_of_top_100_singles_for_{year}_in_Australia']"
          new="urls=[WIKI.format(year=year),f'https://en.wikipedia.org/wiki/List_of_Top_25_singles_for_{year}_in_Australia',f'https://en.wikipedia.org/wiki/List_of_top_100_singles_for_{year}_in_Australia',f'https://en.wikipedia.org/wiki/List_of_Top_100_singles_for_{year}_in_Australia']"
          if old in s:
              s=s.replace(old,new,1)

          marker='def attach_ids(song,lookup):\n'
          if 'def greatest_pool(year,chart_rows):' not in s:
              helper='''def greatest_pool(year,chart_rows):
    rows=chart_rows[:22]
    clauses=[]
    for row in rows:
        clauses.append(f'(recording:"{lucene(row["title"])}" AND artistname:"{lucene(main_artist(row["artist"]))}")')
    if not clauses:return []
    q=f'firstreleasedate:[{year}-01-01 TO {year}-12-31] AND ('+' OR '.join(clauses)+')'
    d=mb_call({'query':q,'limit':100})
    found=[];seen=set()
    for rec in d.get('recordings',[]):
        date=rec.get('first-release-date') or ''
        if not date.startswith(str(year)):continue
        title=clean(rec.get('title'))
        artist=''.join((x if isinstance(x,str) else x.get('name') or (x.get('artist') or {}).get('name') or '') for x in rec.get('artist-credit',[])).strip()
        if not title or not artist or re.search(r'live|remix|demo|karaoke|instrumental',title,re.I):continue
        best=None;score=-1
        for row in rows:
            sc=sim(title,row['title'])*2.4+sim(artist,row['artist'])*1.4
            if sc>score:score=sc;best=row
        if score<1.65:continue
        k=key(title,artist)
        if k in seen:continue
        seen.add(k);found.append((best['rank'],float(rec.get('score') or 0),title,artist))
    found.sort(key=lambda x:(x[0],-x[1]))
    return [{'title':title,'artist':artist,'year':year,'chartRank':rank,'source':'australia-eoy-release','sourceLabel':'Australian year-end chart · release year verified'} for rank,_,title,artist in found[:5]]

'''
              s=s.replace(marker,helper+marker,1)

          start=s.find("    # Greatest Hits: take the highest-ranked Australian annual-chart songs that MusicBrainz confirms were first released that year.\n")
          end=s.find("    # Curated time-warp picks.",start)
          if start!=-1 and end!=-1:
              fast='''    # Greatest Hits: batch-verify annual-chart candidates by exact first-release year.
    for y in YEARS:
        print('Greatest releases',y);pool=[attach_ids(x,lookup) for x in greatest_pool(y,annual[y])];seen={key(x['title'],x['artist']) for x in pool}
        for song in modes['australian'].get(str(y),[]):
            if len(pool)>=4:break
            if key(song['title'],song['artist']) not in seen:seen.add(key(song['title'],song['artist']));pool.append(dict(song))
        if not pool:raise RuntimeError(f'No exact-year Greatest Hits candidate for {y}')
        modes['greatest'][str(y)]=pool

'''
              s=s[:start]+fast+s[end:]
          p.write_text(s)
          PY
          python -m py_compile scripts/build_catalogue.py
      - name: Build catalogue
        run: |
          python - <<'PY'
          import scripts.build_catalogue as b
          early = {
              1950: {'rank':1,'title':'Quicksilver','artist':'Bing Crosby & The Andrews Sisters'},
              1951: {'rank':1,'title':'Too Young','artist':'Nat King Cole'},
              1952: {'rank':1,'title':"Auf Wiederseh'n Sweetheart",'artist':'Vera Lynn'},
              1953: {'rank':1,'title':'Pretend','artist':'Nat King Cole'},
              1954: {'rank':1,'title':'The Happy Wanderer','artist':'Frank Weir'},
          }
          original = b.annual_chart
          def annual_chart(year):
              return [early[year]] if year in early else original(year)
          b.annual_chart = annual_chart
          b.main()
          PY
      - name: Validate catalogue coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/catalogue.json').read_text())
          assert d['version']==6
          for mode in ['greatest','number1_us','number1_au']:
              missing=[y for y in range(1950,2023) if not d['modes'][mode].get(str(y))]
              assert not missing, (mode,missing)
          assert len(d['modes']['australian']) >= 55
          print('coverage',d.get('coverage'))
          PY
      - name: Commit catalogue
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_catalogue.py data/catalogue.json
          git commit -m "Build static song catalogue"
          git pull --rebase origin main
          git push
