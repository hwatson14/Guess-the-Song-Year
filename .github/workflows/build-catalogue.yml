name: Build static catalogue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_catalogue.py
      - .github/workflows/build-catalogue.yml

permissions:
  contents: write

concurrency:
  group: build-catalogue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install catalogue dependencies
        run: pip install requests beautifulsoup4
      - name: Build catalogue
        run: python scripts/build_catalogue.py
      - name: Validate catalogue coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/catalogue.json').read_text())
          assert d['version']==6
          for mode in ['greatest','number1_us','number1_au']:
              missing=[y for y in range(1950,2023) if not d['modes'][mode].get(str(y))]
              assert not missing, (mode,missing)
          assert len(d['modes']['australian']) >= 55
          print('coverage',d.get('coverage'))
          PY
      - name: Commit catalogue
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json
          git commit -m "Build static song catalogue"
          git push
