name: Build static catalogue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_catalogue.py
      - .github/workflows/build-catalogue.yml

permissions:
  contents: write

concurrency:
  group: build-catalogue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install catalogue dependencies
        run: pip install requests beautifulsoup4
      - name: Repair builder source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_catalogue.py')
          s=p.read_text()
          s=s.replace("List_of_top_25_singles_for_{yeary_in_Australia", "List_of_top_25_singles_for_{year}_in_Australia")
          p.write_text(s)
          PY
          python -m py_compile scripts/build_catalogue.py
      - name: Build catalogue
        run: |
          python - <<'PY'
          import scripts.build_catalogue as b

          # Australian Chart Book/KMR-era fallback for years before the
          # Wikipedia annual Top 25 pages begin. These are the Australian
          # annual leaders used only for #1 Australia in 1950-1954.
          early = {
              1950: {'rank':1,'title':'Quicksilver','artist':'Bing Crosby & The Andrews Sisters'},
              1951: {'rank':1,'title':'Too Young','artist':'Nat King Cole'},
              1952: {'rank':1,'title':"Auf Wiederseh'n Sweetheart",'artist':'Vera Lynn'},
              1953: {'rank':1,'title':'Pretend','artist':'Nat King Cole'},
              1954: {'rank':1,'title':'The Happy Wanderer','artist':'Frank Weir'},
          }
          original = b.annual_chart
          def annual_chart(year):
              if year in early:
                  return [early[year]]
              return original(year)
          b.annual_chart = annual_chart
          b.main()
          PY
      - name: Validate catalogue coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/catalogue.json').read_text())
          assert d['version']==6
          for mode in ['greatest','number1_us','number1_au']:
              missing=[y for y in range(1950,2023) if not d['modes'][mode].get(str(y))]
              assert not missing, (mode,missing)
          assert len(d['modes']['australian']) >= 55
          print('coverage',d.get('coverage'))
          PY
      - name: Commit catalogue
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_catalogue.py data/catalogue.json
          git commit -m "Build static song catalogue"
          git push
