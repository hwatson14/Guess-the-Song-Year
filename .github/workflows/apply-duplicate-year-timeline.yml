name: Apply duplicate year timeline patch

on:
  push:
    branches: [fix/duplicate-year-stacks-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Apply native duplicate-year timeline patch
        run: python scripts/_apply_duplicate_year_timeline.py
      - name: Validate full application
        run: node scripts/check.mjs
      - name: Commit finished patch
        run: |
          rm scripts/_apply_duplicate_year_timeline.py .github/workflows/apply-duplicate-year-timeline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stack duplicate years in timeline rows"
          git push
