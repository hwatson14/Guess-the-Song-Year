name: One Hit Wonders seed audit

on:
  push:
    branches: [mode-expansion-verification]
    paths:
      - .github/workflows/one-hit-wonders-seed-audit.yml
      - scripts/audit_one_hit_wonders_seed.py
      - verification/mode-expansion/one-hit-wonders-seed.csv
      - data/song-database.json

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mode-expansion-verification
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Match seed to canonical masters
        run: python scripts/audit_one_hit_wonders_seed.py
      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/mode-expansion/one-hit-wonders-match-report.csv verification/mode-expansion/one-hit-wonders-match-summary.json
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Update One Hit Wonders canonical match report"
            git push
          fi
