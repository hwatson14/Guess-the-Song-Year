name: Fix early Billboard page discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-early-page-search.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore broad early-year discovery
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_catalogue_v8.py')
          s=p.read_text()
          old="q = f'Billboard year-end pop singles {year}'"
          new="q = f'Billboard year-end singles {year}'"
          if old not in s:
              raise SystemExit('expected early page query not found')
          s=s.replace(old,new,1)
          s=s.replace("raise RuntimeError(f'No Billboard pop year-end page found for {year}')", "raise RuntimeError(f'No Billboard year-end page found for {year}')",1)
          p.write_text(s)
          PY
          python -m py_compile scripts/build_catalogue_v8.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_catalogue_v8.py
          git commit -m "Fix early Billboard year-end page discovery"
          git pull --rebase origin main
          git push