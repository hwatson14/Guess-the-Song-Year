name: P1 evidence and provider hardening

on:
  push:
    branches: [chatgpt/p1-evidence-provider]

concurrency:
  group: p1-evidence-provider-final
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync current main before hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Materialize hardening policy
        run: |
          node scripts/migrations/2026-09-06-provider-incremental.mjs --write
          node scripts/migrations/2026-09-06-provider-policy-v2.mjs --write
          node scripts/migrations/2026-09-06-spotify-static-identity.mjs --write
          node scripts/migrations/2026-09-06-p1-cache-bump.mjs --write
      - name: Syntax-check hardening tools
        run: python -m py_compile scripts/harden_release_evidence.py scripts/harden_provider_links.py scripts/test_hardening_policy.py
      - name: Confirm release evidence baseline is durable
        run: |
          test -f verification/release-evidence-review-queue.json
          test -f verification/provider-recording-research.json
          test -f verification/provider-hardening-review-queue.json
      - name: Rebuild generated catalogue and status
        run: |
          node scripts/song_database.mjs build
          node scripts/song_database_report.mjs --write
          node scripts/provider_review_report.mjs
      - name: Full regression gate
        run: node scripts/check.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit final hardened runtime and evidence state
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No final hardening changes to commit"
            exit 0
          fi
          git commit -m "Finalize P1 evidence and provider hardening"
          git push origin HEAD:${GITHUB_REF_NAME}
