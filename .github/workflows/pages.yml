name: Deploy Guess the Song Year

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate runtime and catalogue before publishing
        run: node scripts/check.mjs
      - name: Report physical-card evidence status
        continue-on-error: true
        run: python scripts/require_verified_card_years.py
      - name: Stage public application files
        run: |
          mkdir -p _site/data
          cp index.html app.css app.js app-policy.js engine.js engine-v7.js placement-ui.css placement-ui.js robots.txt THIRD_PARTY_NOTICES.md _site/
          cp data/catalogue.json data/modes.json _site/data/
          cp -R assets vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
