name: Deploy Guess the Song Year

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript and no-repeat engine
        run: |
          node --check engine.js
          node --check engine-v7.js
          node --check app.js
          node scripts/test_engine_v7.mjs
      - name: Validate prebuilt catalogue
        run: |
          python scripts/validate_catalogue.py
          python -m json.tool data/catalogue.schema.json >/dev/null
      - name: Validate gameplay contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          js=Path('app.js').read_text()
          guard=Path('engine-v7.js').read_text()
          data=json.loads(Path('data/catalogue.json').read_text())
          for token in ['ensureVirtualStarters','starterYear','match.pendingSlot=slot','Starter year:','Listen Again','Listen for as long as you want','data-action="new-card"','Wrong answer','Correct answer','repeat-replaced']:
              assert token in js, token
          for forbidden in ['setTimeout(()=>finishYouTubeListening(),30000)','match.assign[']:
              assert forbidden not in js, forbidden
          assert 'NO_UNUSED_SONG' in guard
          if data.get('version')==11:
              expected={'greatest','sing_along','australian','unexpected','party','rock'}
              assert set(data.get('modes',{}))==expected
              assert 'data-mode=' in js
              assert 'function modeId()' in js
              assert "const MODE='greatest'" not in js
              assert 'E.isAlternateSongTitle=isAlternateTitle' in guard
              for mode in expected-{'greatest'}:
                  assert data['modeFallbacks'].get(mode)=='greatest',mode
          else:
              assert "const MODE='greatest'" in js
              assert 'Only Greatest Hits is enabled' in guard
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
