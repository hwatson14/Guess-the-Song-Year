name: Deploy Guess the Song Year

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript and no-repeat engine
        run: |
          node --check engine.js
          node --check engine-v7.js
          node --check app.js
          node scripts/test_engine_v7.mjs
      - name: Validate prebuilt catalogue
        run: |
          python scripts/validate_catalogue.py
          python -m json.tool data/catalogue.schema.json >/dev/null
      - name: Enforce canonical v10 or verified playlist v11 catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/catalogue.json').read_text())
          version=data.get('version')
          assert version in (10,11),f'Only canonical v10 or verified playlist v11 may deploy, got {version}'
          if version==10:
              assert set(data.get('modes',{}))=={'greatest'},sorted(data.get('modes',{}))
          else:
              expected={'greatest','sing_along','australian','unexpected','party','rock'}
              assert set(data.get('modes',{}))==expected,sorted(data.get('modes',{}))
              for mode in expected-{'greatest'}:
                  assert data.get('modeFallbacks',{}).get(mode)=='greatest',mode
          greatest=data['modes']['greatest']
          assert set(map(int,greatest))==set(range(1950,2023)),len(greatest)
          for year,pool in greatest.items():
              keys=set()
              for song in pool:
                  assert int(song.get('year',0))==int(year),(year,song)
                  key=str(song.get('canonicalKey') or '')
                  assert key,(year,song)
                  assert key not in keys,(year,key)
                  keys.add(key)
          print('deployment catalogue gate passed',{'version':version,'modes':sorted(data['modes'])})
          PY
      - name: Validate gameplay contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          js=Path('app.js').read_text();guard=Path('engine-v7.js').read_text();data=json.loads(Path('data/catalogue.json').read_text())
          for token in ['ensureVirtualStarters','starterYear','match.pendingSlot=slot','Starter year:','Listen Again','Listen for as long as you want','data-action="new-card"','Wrong answer','Correct answer','repeat-replaced']:
              assert token in js, token
          for forbidden in ['setTimeout(()=>finishYouTubeListening(),30000)','match.assign[']:
              assert forbidden not in js, forbidden
          for token in ['NO_UNUSED_SONG','E.songUseKey=underlyingKey','E.isAlternateSongTitle=isAlternateTitle']:
              assert token in guard, token
          if data.get('version')==11:
              assert 'data-mode=' in js
              assert 'function modeId()' in js
              assert "const MODE='greatest'" not in js
              for label in ['Sing Along','Australian','Unexpected Years','Party Anthems','Rock Classics']:
                  assert label in guard,label
          else:
              assert 'data-mode=' not in js
              assert 'function modeId()' not in js
              assert "const MODE='greatest'" in js
              assert 'Only Greatest Hits is enabled' in guard
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
