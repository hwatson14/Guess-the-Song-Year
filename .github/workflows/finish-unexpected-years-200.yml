name: Build Unexpected Years 200

on:
  push:
    branches: [finish-unexpected-years-200]
    paths:
      - 'scripts/finish_unexpected_years_200.mjs'
      - 'scripts/add_1982_greatest_backfill.mjs'
      - 'scripts/preserve_unexpected_superseded_claims.mjs'
      - 'scripts/test_catalogue_expansion.mjs'
      - 'scripts/test_unexpected_years_200.mjs'
      - 'scripts/test_catalogue_cleanup.mjs'
      - 'scripts/check.mjs'
      - 'scripts/song_database_report.mjs'
      - '.github/workflows/finish-unexpected-years-200.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Add sourced 1982 Greatest backfill master
        run: node scripts/add_1982_greatest_backfill.mjs --write
      - name: Resolve reviewed selection and write canonical data
        run: node scripts/finish_unexpected_years_200.mjs --write
      - name: Preserve superseded release evidence for audit
        run: node scripts/preserve_unexpected_superseded_claims.mjs --write
      - name: Refresh database status
        run: node scripts/song_database_report.mjs --write
      - name: Validate full current application and catalogue
        run: node scripts/check.mjs
      - name: Commit generated expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/song-database.json data/catalogue.json verification/unexpected-years-200-selection.json verification/song-database-status.json
          git commit -m "feat: expand Unexpected Years to 200 songs"
          git push
