name: P0 canonical year migration

on:
  push:
    branches: [chatgpt/p0-canonical-year]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Materialize schema v2 and patch canonical source ownership
        run: |
          node scripts/migrations/2026-09-06-canonical-year-v2.mjs --write
          node scripts/migrations/2026-09-06-canonical-year-v2-followup.mjs --write
          node scripts/migrations/2026-09-06-canonical-year-v2-verification-followup.mjs --write
      - name: Rebuild generated catalogue and status
        run: |
          node scripts/song_database.mjs build
          node scripts/song_database_report.mjs --write
      - name: Prove v1 to v2 runtime parity
        run: node scripts/migrations/verify-v1-v2-parity.mjs
      - name: Full validation gate
        run: node scripts/check.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit materialized migration
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize canonical song identity and release years"
          git push origin HEAD:${GITHUB_REF_NAME}
