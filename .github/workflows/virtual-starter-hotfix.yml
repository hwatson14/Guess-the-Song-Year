name: Virtual starter and placement hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/virtual-starter-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply gameplay patch
        run: |
          python scripts/patch_virtual_and_youtube.py
          node --check app.js
          grep -q "ensureVirtualStarters" app.js
          grep -q "match.pendingSlot=slot" app.js
          grep -q "Starter year:" app.js
          grep -q "Listen Again" app.js
          grep -q "Listen for as long as you want" app.js
          ! grep -q "30000" app.js
          grep -q "v=7.2.2" index.html
      - name: Commit gameplay fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css index.html
          git commit -m "Add virtual starter years and unrestricted YouTube listening"
          git pull --rebase origin main
          git push
