name: One Hit Wonders resolution

on:
  push:
    branches: [mode-expansion-content]
    paths:
      - verification/mode-expansion/one-hit-wonders-resolve-trigger.txt

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mode-expansion-content
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install resolver dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Resolve core and expansion candidates
        run: python scripts/resolve_one_hit_wonders_seed.py
      - name: Commit resolution report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/mode-expansion/one-hit-wonders-resolution-report.csv verification/mode-expansion/one-hit-wonders-resolution-summary.json
          if git diff --cached --quiet; then
            echo "No resolution changes"
          else
            git commit -m "Resolve One Hit Wonders release evidence"
            git push
          fi
