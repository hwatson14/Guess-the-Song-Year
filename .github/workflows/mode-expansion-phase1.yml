name: Mode expansion phase 1

on:
  push:
    branches: [mode-expansion-verification]
    paths:
      - .github/workflows/mode-expansion-phase1.yml
      - scripts/validate_modes.py

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mode-expansion-verification
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply runtime generalisation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path);text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected patch anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace('engine.js',
            "        if(MODES[id]&&meta&&typeof meta==='object')Object.assign(MODES[id],meta);",
            "        if(meta&&typeof meta==='object')MODES[id]=Object.assign(MODES[id]||{},meta);")

          replace('engine-v7.js',
            "  const supported=['greatest','australian','unexpected','number1_us','number1_au'];\n  for(const id of Object.keys(E.MODES||{}))if(!supported.includes(id))delete E.MODES[id];\n\n",
            "")

          replace('app.js',
            "${report.yearBasis==='chart'?'chart year':'release year'}",
            "${report.yearBasis==='chart'?'chart year':report.yearBasis==='screen'?'screen-work year':'release year'}")
          replace('mode-labels.js',
            "const basis=report.yearBasis==='chart'?'chart year':'release year';",
            "const basis=report.yearBasis==='chart'?'chart year':report.yearBasis==='screen'?'screen-work year':'release year';")

          # Membership-explicit playback (used by Remix: Original Year) must never fall
          # through to generic provider search, which could silently play the original.
          replace('engine.js',
            "  async function resolveSpotify(song){\n    if(!isSpotifyConnected())throw new AppError('SPOTIFY_NOT_CONNECTED','Connect the Spotify Premium account first.');",
            "  async function resolveSpotify(song){\n    if(!isSpotifyConnected())throw new AppError('SPOTIFY_NOT_CONNECTED','Connect the Spotify Premium account first.');\n    if(song.playbackPolicy==='membership-explicit'&&!song.spotifyId)throw new AppError('SPOTIFY_TRACK_NOT_FOUND',`No reviewed Spotify alternate is available for “${song.title}”. Switch provider or choose another card.`);")

          replace('engine.js',
            "    if(song.spotifyId){\n      try{const t=await spotifyApi(`/tracks/${encodeURIComponent(song.spotifyId)}`);cachePut('spotify',song,{id:t.id});return spotifyTrack(t)}\n      catch(err){if(err?.status!==404)throw err}\n    }\n    const queries=",
            "    if(song.spotifyId){\n      try{const t=await spotifyApi(`/tracks/${encodeURIComponent(song.spotifyId)}`);cachePut('spotify',song,{id:t.id});return spotifyTrack(t)}\n      catch(err){if(err?.status!==404)throw err;if(song.playbackPolicy==='membership-explicit')throw new AppError('SPOTIFY_TRACK_NOT_FOUND',`The reviewed Spotify alternate for “${song.title}” is unavailable.`)}\n    }\n    if(song.playbackPolicy==='membership-explicit')throw new AppError('SPOTIFY_TRACK_NOT_FOUND',`No reviewed Spotify alternate is available for “${song.title}”.`);\n    const queries=")

          replace('engine.js',
            "  async function resolveYouTube(song){\n    const cached=cacheGet('youtube',song);",
            "  function providerMatchSong(song){return song?.playbackTitle||song?.playbackArtist?{...song,title:song.playbackTitle||song.title,artist:song.playbackArtist||song.artist}:song}\n\n  async function resolveYouTube(song){\n    const matchSong=providerMatchSong(song);\n    if(song.playbackPolicy==='membership-explicit'&&!song.youtubeId)throw new AppError('YOUTUBE_VIDEO_NOT_FOUND',`No reviewed YouTube alternate is available for “${song.title}”. Switch provider or choose another card.`);\n    const cached=cacheGet('youtube',song);")

          replace('engine.js',
            "const valid=(await validateYouTubeIds(cached.ids)).filter(video=>youtubeCandidateAllowed(video,song));",
            "const valid=(await validateYouTubeIds(cached.ids)).filter(video=>youtubeCandidateAllowed(video,matchSong));")

          replace('engine.js',
            "    if(song.youtubeId)ids.push(song.youtubeId);\n    if(ids.length){const valid=(await validateYouTubeIds(ids)).filter(video=>youtubeCandidateAllowed(video,song));ids=valid.map(x=>x.id)}\n    if(!ids.length){\n      const q=`${song.title} ${mainArtist(song.artist)} official audio`;",
            "    if(song.youtubeId)ids.push(song.youtubeId);\n    if(ids.length){const valid=(await validateYouTubeIds(ids)).filter(video=>youtubeCandidateAllowed(video,matchSong));ids=valid.map(x=>x.id)}\n    if(!ids.length&&song.playbackPolicy==='membership-explicit')throw new AppError('YOUTUBE_VIDEO_NOT_FOUND',`The reviewed YouTube alternate for “${song.title}” is unavailable.`);\n    if(!ids.length){\n      const q=`${matchSong.title} ${mainArtist(matchSong.artist)} official audio`;")

          replace('engine.js',
            "const valid=(await validateYouTubeIds(raw.map(x=>x.id))).filter(video=>youtubeCandidateAllowed(video,song));",
            "const valid=(await validateYouTubeIds(raw.map(x=>x.id))).filter(video=>youtubeCandidateAllowed(video,matchSong));")
          replace('engine.js',
            "valid.sort((a,b)=>youtubeScore(byId.get(b.id),song)-youtubeScore(byId.get(a.id),song));",
            "valid.sort((a,b)=>youtubeScore(byId.get(b.id),matchSong)-youtubeScore(byId.get(a.id),matchSong));")
          PY
      - name: Run full validation suite and capture output
        run: |
          set +e
          mkdir -p verification/mode-expansion
          node scripts/check.mjs > verification/mode-expansion/phase1-validation.log 2>&1
          code=$?
          echo "$code" > verification/mode-expansion/phase1-validation-exit-code.txt
          cat verification/mode-expansion/phase1-validation.log
          exit 0
      - name: Commit validation result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          code="$(cat verification/mode-expansion/phase1-validation-exit-code.txt)"
          git add verification/mode-expansion/phase1-validation.log verification/mode-expansion/phase1-validation-exit-code.txt
          if [ "$code" = "0" ]; then
            git add engine.js engine-v7.js app.js mode-labels.js
          fi
          git commit -m "Record mode expansion phase 1 validation" || true
          git push
      - name: Fail if validation failed
        run: |
          code="$(cat verification/mode-expansion/phase1-validation-exit-code.txt)"
          if [ "$code" != "0" ]; then exit "$code"; fi
