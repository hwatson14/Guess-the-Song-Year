name: Recording release-year diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recording-year-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Verify modern chart-year traps
        run: |
          python - <<'PY'
          import importlib.util,re,time
          from pathlib import Path
          p=Path('scripts/build_catalogue_v8.py')
          spec=importlib.util.spec_from_file_location('b',p)
          b=importlib.util.module_from_spec(spec);spec.loader.exec_module(b)
          endpoint='https://musicbrainz.org/ws/2/recording/'
          last=0.0
          def rec_year(row):
              global last
              wait=max(0,1.1-(time.time()-last))
              if wait: time.sleep(wait)
              q=f'recording:"{b.lucene(row["title"])}" AND artistname:"{b.lucene(b.main_artist(row["artist"]))}"'
              r=b.get(endpoint,params={'fmt':'json','limit':100,'query':q},headers={'User-Agent':b.UA,'Accept':'application/json'})
              last=time.time()
              valid=[]
              for e in r.json().get('recordings',[]):
                  date=b.clean(e.get('first-release-date'))
                  if not re.match(r'^\d{4}',date) or not b.plausible_match(e,row): continue
                  ts,ars,total=b.match_scores(e,row)
                  valid.append((int(date[:4]),-total,-float(e.get('score') or 0),b.clean(e.get('title')),b.artist_credit(e),ts,ars))
              return sorted(valid)[0] if valid else None
          traps=[
              (2021,2019,'Blinding Lights','The Weeknd'),
              (2021,2020,'Levitating','Dua Lipa'),
              (2021,2020,'Mood','24kGoldn featuring Iann Dior'),
              (2021,2020,'Save Your Tears','The Weeknd and Ariana Grande'),
              (2022,2020,'Heat Waves','Glass Animals'),
              (2022,2021,'Shivers','Ed Sheeran'),
              (2022,2021,'Bad Habits','Ed Sheeran'),
          ]
          for claimed,expected,title,artist in traps:
              ev=rec_year({'title':title,'artist':artist})
              print('TRAP',claimed,title,'=>',ev)
              assert ev and ev[0]==expected,(claimed,expected,title,ev)
              assert ev[0]!=claimed,(claimed,title,ev)
          PY