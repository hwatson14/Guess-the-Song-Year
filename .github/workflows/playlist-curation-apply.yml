name: Apply reviewed playlist migration (temporary)
on:
  push:
    branches:
      - fix/verified-release-years-and-australian-hits-20261102
    paths:
      - .github/workflows/playlist-curation-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'hwatson14/Guess-the-Song-Year'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical source and browser catalogue
        run: |
          node scripts/migrations/run-reviewed-playlists.mjs
          node scripts/song_database.mjs check
      - name: Commit generated data to this PR branch only
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/song-database.json data/catalogue.json verification/playlist-retirements-2026-11-02.json
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Apply reviewed canonical year fixes and Australian song additions'
          git push origin "HEAD:refs/heads/$BRANCH"
