name: Playlist runtime regression

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-playlist-runtime.yml
      - data/catalogue.json
      - data/catalogue.schema.json
      - scripts/validate_catalogue.py
      - scripts/test_engine_v7.mjs
      - app.js
      - engine-v7.js

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check JavaScript runtime
        run: |
          node --check engine.js
          node --check engine-v7.js
          node --check app.js
          node scripts/test_engine_v7.mjs
      - name: Check playlist state when materialised
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.loads(Path('data/catalogue.json').read_text())
          if d.get('version')!=11:
              print('Playlist catalogue not materialised on this commit; canonical build will validate it before commit.')
              raise SystemExit(0)
          expected={'greatest','sing_along','australian','unexpected','party','rock'}
          assert set(d.get('modes',{}))==expected,set(d.get('modes',{}))
          subprocess.run(['python','scripts/validate_catalogue.py'],check=True)
          app=Path('app.js').read_text();engine=Path('engine-v7.js').read_text()
          assert 'data-mode=' in app
          assert "const MODE='greatest'" not in app
          for label in ['Sing Along','Australian','Unexpected Years','Party Anthems','Rock Classics']:
              assert label in engine,label
          print('Final six-playlist runtime regression passed.')
          PY
