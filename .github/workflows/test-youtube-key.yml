name: Test YouTube key

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test restricted key with live-site referrer
        shell: bash
        run: |
          KEY=$(python - <<'PY'
          import re
          s=open('index.html').read()
          m=re.search(r"const BUILTIN_YT_KEY='([^']+)'", s)
          assert m, 'Built-in YouTube key not found'
          print(m.group(1))
          PY
          )
          STATUS=$(curl -sS -o /tmp/yt.json -w '%{http_code}' \
            -H 'Referer: https://hwatson14.github.io/Guess-the-Song-Year/' \
            "https://www.googleapis.com/youtube/v3/videos?part=id&id=dQw4w9WgXcQ&key=${KEY}")
          python - "$STATUS" <<'PY'
          import json, sys
          status=int(sys.argv[1])
          d=json.load(open('/tmp/yt.json'))
          if status==200 and d.get('items'):
              print('PASS: YouTube Data API key accepted with the Guess-the-Song-Year referrer.')
          else:
              err=d.get('error',{})
              print('FAIL:', status, err.get('status'), err.get('message'))
              raise SystemExit(1)
          PY
