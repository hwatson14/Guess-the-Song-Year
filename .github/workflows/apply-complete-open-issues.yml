name: Apply complete open issues

on:
  push:
    branches: [fix/complete-open-issues]
    paths:
      - .github/workflows/apply-complete-open-issues.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/complete-open-issues
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply canonical memberships and native UI fixes
        run: |
          node scripts/complete_open_issues.mjs
          node scripts/song_database.mjs build
          python scripts/apply_complete_open_issues_ui.py
      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete open mode and UI issues"
          git push origin HEAD:fix/complete-open-issues
