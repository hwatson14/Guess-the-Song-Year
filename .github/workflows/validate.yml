name: Validate app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript
        run: |
          node --check engine.js
          node --check engine-v7.js
          node --check app.js
      - name: Validate prebuilt catalogue
        run: |
          python scripts/validate_catalogue.py
          python -m json.tool data/catalogue.schema.json >/dev/null
      - name: Validate one-mode app shell
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          for asset in ['engine.js','engine-v7.js','app.js','app.css']:
              assert asset in html, asset
          js=Path('app.js').read_text()
          guard=Path('engine-v7.js').read_text()
          for token in ["const MODE='greatest'",'Play style','Teams','Victory target','physical','virtual','lock-placement','popstate','end-game','ensureVirtualStarters','starterYear','match.pendingSlot=slot','Starter year:','Listen Again','Listen for as long as you want']:
              assert token in js, token
          for forbidden in ['data-deck=','data-policy=','data-round-deck=','setTimeout(()=>finishYouTubeListening(),30000)']:
              assert forbidden not in js, forbidden
          assert "Only Greatest Hits is enabled" in guard
          print('one-mode app contract validated')
          PY