name: Validate app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript
        run: |
          node --check engine.js
          node --check app.js
      - name: Validate prebuilt catalogue
        run: |
          python scripts/validate_catalogue.py
          python -m json.tool data/catalogue.schema.json >/dev/null
      - name: Validate one-mode app shell
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert 'engine.js' in html and 'app.js' in html and 'app.css' in html
          js=Path('app.js').read_text()
          for token in ["const MODE='greatest'",'Play style','Teams','Victory target','physical','virtual','lock-placement','popstate','end-game']:
              assert token in js, token
          for forbidden in ['data-deck=','data-policy=','data-round-deck=']:
              assert forbidden not in js, forbidden
          print('one-mode app contract validated')
          PY
