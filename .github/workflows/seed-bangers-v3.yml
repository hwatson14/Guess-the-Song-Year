name: Seed Bangers V3 data
on:
  push:
    branches: [feat/bangers-singalong-v3]
    paths:
      - 'scripts/migrations/apply-bangers-v3.mjs'
      - 'verification/bangers-v3-seed.json'
      - '.github/workflows/seed-bangers-v3.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/migrations/apply-bangers-v3.mjs
      - name: Commit generated data to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/song-database.json data/catalogue.json data/modes.json verification/bangers-v3-implementation.json
          git commit -m "Materialize Bangers V3 catalogue"
          git push
